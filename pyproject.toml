[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaolinrag"
version = "0.1.0"
description = "小林面试笔记 RAG 问答系统"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "rank_bm25>=0.2.2",
    "jieba>=0.42.1",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["xiaolinrag"]

[tool.setuptools.package-data]
xiaolinrag = ["static/*"]
